name: Build Byepervisor Reborn ELF
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Create Workspace Environment
        run: |
          mkdir -p $HOME/ps5-workspace
          echo "WORKSPACE_DIR=$HOME/ps5-workspace" >> $GITHUB_ENV

      - name: Install Toolchain and Compilers
        run: |
          sudo apt update
          sudo apt install -y clang-18 lld-18 make git

      - name: Clone ps5-payload-dev SDK
        run: |
          # Download and compile the base system SDK layout natively
          git clone https://github.com ${{ env.WORKSPACE_DIR }}/sdk
          cd ${{ env.WORKSPACE_DIR }}/sdk
          make
          echo "PS5_PAYLOAD_SDK=${{ env.WORKSPACE_DIR }}/sdk" >> $GITHUB_ENV

      - name: Clone Byepervisor Reborn Source Code
        run: |
          # Target the correct 13.60-capable repository architecture
          git clone --recursive https://github.com ${{ env.WORKSPACE_DIR }}/Byepervisor-Reborn

      - name: Compile Target 13.60 Binary
        run: |
          cd ${{ env.WORKSPACE_DIR }}/Byepervisor-Reborn
          # Run the cross-compilation pipeline utilizing the linked SDK offsets
          make FIRMWARE=13.60 CC=clang-18 CXX=clang++-18

      - name: Upload Finished ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byepervisor-13.60-binary
          path: ${{ env.WORKSPACE_DIR }}/Byepervisor-Reborn/byepervisor.elf
