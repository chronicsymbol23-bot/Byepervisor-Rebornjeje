name: Build Byepervisor Reborn ELF
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Create Isolated Directories
        run: |
          mkdir -p $HOME/ps5-workspace/sdk
          mkdir -p $HOME/ps5-workspace/Byepervisor-Reborn

      - name: Install Toolchain and Compilers
        run: |
          sudo apt update
          sudo apt install -y clang-18 lld-18 make unzip wget

      - name: Download and Unpack SDK (Bypassing Git)
        run: |
          # Fetching the official developer SDK zip package
          wget https://github.com -O $HOME/sdk.zip
          unzip $HOME/sdk.zip -d $HOME/ps5-workspace/
          # Align folder names cleanly
          mv $HOME/ps5-workspace/sdk-main/* $HOME/ps5-workspace/sdk/
          
          # Compile the local SDK framework
          cd $HOME/ps5-workspace/sdk
          make
          echo "PS5_PAYLOAD_SDK=$HOME/ps5-workspace/sdk" >> $GITHUB_ENV

      - name: Download and Unpack Byepervisor Reborn Source
        run: |
          # Fetching the exploit package zip archive
          wget https://github.com -O $HOME/byepervisor.zip
          unzip $HOME/byepervisor.zip -d $HOME/ps5-workspace/
          mv $HOME/ps5-workspace/Byepervisor-Reborn-main/* $HOME/ps5-workspace/Byepervisor-Reborn/

      - name: Compile Target 13.60 Binary
        run: |
          cd $HOME/ps5-workspace/Byepervisor-Reborn
          # Cross-compile utilizing the clean localized environment variables
          make FIRMWARE=13.60 CC=clang-18 CXX=clang++-18

      - name: Upload Finished ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byepervisor-13.60-binary
          path: /home/runner/ps5-workspace/Byepervisor-Reborn/byepervisor.elf
