name: Fetch Pre-Built Byepervisor Reborn ELF
on: [workflow_dispatch]

jobs:
  get-binary:
    runs-on: ubuntu-24.04
    steps:
      - name: Create Workspace Folder
        run: mkdir -p $HOME/output

      - name: Download Pre-Compiled Exploit ELF
        run: |
          # Fetch the verified build straight from the release pipeline assets
          wget https://github.com -O $HOME/output/byepervisor.elf
          
          # If the repository doesn't have a release asset yet, fetch the automated nightly build variant
          if [ ! -f $HOME/output/byepervisor.elf ]; then
            wget https://github.com -O $HOME/output/byepervisor.elf
          fi

      - name: Upload Working ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byepervisor-13.60-binary
          path: /home/runner/output/byepervisor.elf
